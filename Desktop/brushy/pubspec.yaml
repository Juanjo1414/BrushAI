name: brushy
description: "Brushy AI"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ML (versiones compatibles entre sí)
  tflite_flutter: 0.11.0
  image: 3.3.0
  # Nota: no se requiere dependencia directa de camera; image_picker maneja cámara/galería

  # Media
  image_picker: 1.2.0
  permission_handler: 11.4.0

  # Backend
  mongo_dart: 0.10.5
  supabase_flutter: 2.1.0
  http: 1.1.0

  cupertino_icons: 1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ml/
